<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Forest Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#074239" />
      <stop offset="50%" stop-color="#063A33" />
      <stop offset="100%" stop-color="#021C18" />
    </linearGradient>

    <!-- Metallic Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4DC" />
      <stop offset="35%" stop-color="#E5C37E" />
      <stop offset="70%" stop-color="#D4AF67" />
      <stop offset="100%" stop-color="#9C7326" />
    </linearGradient>

    <!-- Inner Shadow for Depth -->
    <filter id="goldShine" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.75" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Deep Teal Circle with Champagne Gold Rim -->
  <circle
    cx="32"
    cy="32"
    r="30"
    fill="url(#tealGrad)"
    stroke="url(#goldGrad)"
    stroke-width="2.25"
  />

  <!-- Delicate Hairline Dotted Inner Ring -->
  <circle
    cx="32"
    cy="32"
    r="26"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="0.75"
    stroke-dasharray="2 1.5"
    stroke-opacity="0.8"
  />

  <!-- Monogram Letter: O (Precision Serif Vector) -->
  <path
    fill="url(#goldGrad)"
    fill-rule="evenodd"
    filter="url(#goldShine)"
    d="M 18,21.5 C 13.5,21.5 10.5,26 10.5,32 C 10.5,38 13.5,42.5 18,42.5 C 22.5,42.5 25.5,38 25.5,32 C 25.5,26 22.5,21.5 18,21.5 Z M 18,24.5 C 20.8,24.5 22.2,27.8 22.2,32 C 22.2,36.2 20.8,39.5 18,39.5 C 15.2,39.5 13.8,36.2 13.8,32 C 13.8,27.8 15.2,24.5 18,24.5 Z"
  />

  <!-- Centered Diamond Ornament ◈ -->
  <g filter="url(#goldShine)">
    <!-- Outer Diamond -->
    <polygon points="32,27 36.5,32 32,37 27.5,32" fill="url(#goldGrad)" />
    <!-- Inner Cutout Diamond -->
    <polygon points="32,29.3 34.3,32 32,34.7 29.7,32" fill="#063A33" />
  </g>

  <!-- Monogram Letter: T (Precision Serif Vector) -->
  <path
    fill="url(#goldGrad)"
    filter="url(#goldShine)"
    d="M 38.5,26 L 40,26 C 40.5,24.5 41.5,24 43.5,24 L 44.5,24 L 44.5,40.5 C 44.5,41.2 43.8,41.5 42,41.5 L 42,42.5 L 50,42.5 L 50,41.5 C 48.2,41.5 47.5,41.2 47.5,40.5 L 47.5,24 L 48.5,24 C 50.5,24 51.5,24.5 52,26 L 53.5,26 L 53.5,21.5 L 38.5,21.5 Z"
  />
</svg>
